<script>
"use strict";

function autoSlash(el){
  const pos=el.selectionStart;const prev=el.value;
  let v=el.value.replace(/\D/g,'');
  if(v.length>8)v=v.slice(0,8);
  let r=v;
  if(v.length>4)r=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>2)r=v.slice(0,2)+'/'+v.slice(2);
  el.value=r;
}
function toYMD(s){
  if(!s)return'';const p=s.split('/');
  if(p.length!==3||p[2].length<4)return'';
  return p[2].slice(0,4)+'-'+p[0].padStart(2,'0')+'-'+p[1].padStart(2,'0');
}
function toMDY(s){
  if(!s)return'';const p=s.split('-');
  if(p.length!==3)return'';
  return p[1]+'/'+p[2]+'/'+p[0];
}
function saveCFState(){
  if(!A||!A.cf)return;
  const sel=document.getElementById('cr_ship_sel')?.value;
  const txt=document.getElementById('cr_ship')?.value||'';
  A.cf={...A.cf,
    ship:sel&&sel!=='other'?sel:(txt||A.cf.ship),
    sailDate:toYMD(document.getElementById('cr_sail')?.value||'')||A.cf.sailDate,
    returnDate:toYMD(document.getElementById('cr_ret')?.value||'')||A.cf.returnDate,
    itinerary:document.getElementById('cr_itin')?.value??A.cf.itinerary,
    organizerName:document.getElementById('cr_name')?.value??A.cf.organizerName,
    organizerContact:document.getElementById('cr_contact')?.value??A.cf.organizerContact,
    facebookLink:document.getElementById('cr_fb')?.value??A.cf.facebookLink,
    pin:document.getElementById('cr_pin')?.value??A.cf.pin,
    closeDate:toYMD(document.getElementById('cr_close')?.value||'')||A.cf.closeDate,
    lateCloseDate:toYMD(document.getElementById('cr_lclose')?.value||'')||A.cf.lateCloseDate,
    pixieCloseDate:toYMD(document.getElementById('cr_pclose')?.value||'')||A.cf.pixieCloseDate,
    globalMin:document.querySelector('input[onchange*="globalMin"]')?.value??A.cf.globalMin,
  };
}
function getDeadlineErr(id,fg,g){
  const now=new Date();
  if(!fg)return null;
  if(fg.isPixie){
    if(g.pixie_close_date&&now>new Date(g.pixie_close_date+'T23:59:00'))return'Pixie Dust sign-ups have closed.';
    return null;
  }
  if(fg.isLate){

function buildGroupsByDeck(entries,feGroup){

  DECK_ORDER.forEach(dk=>{const dm=byDeck[dk]||[];if(!dm.length)return;let i=0;while(i<dm.length){const sl=dm.slice(i,i+cap);i+=cap;while(sl.length<cap&&fp.length)sl.push(fp.shift());groups.push({name:pool[groups.length%pool.length],primaryDeck:dk,memberIds:sl.map(m=>m.id)});}});

        const px=cx+Math.cos(angle)*r2;
        const py=cy+Math.sin(angle)*r2;
        const sz=1.5+Math.random()*3;
        const dur=Math.floor(480+Math.random()*380);
        setTimeout(()=>_glimmer(px,py,sz,dur,'shimmer'),Math.floor(Math.random()*110));
      }
      _glimmer(cx,cy,5+Math.random()*5,380,'castlePulseAnim');
    },rd);
  });
  setTimeout(_castlePulse,3000+Math.random()*2000);
}

async function searchPublicGroups(){
  const ship=(document.getElementById("dirShip")?.value||"").trim();

  try{
    const rows=await sbGet("groups",{is_public:true});

}

  try{const rows=await sbGet("groups",{code:A.pendingCode});if(!rows.length){R.innerHTML=sparkles()+`<div class="wrap" style="text-align:center;padding-top:80px"><div class="big-icon">🔍</div><h2 style="font-family:'Cinzel Decorative',serif;font-size:1.2rem;color:#C62828;margin-bottom:12px">Group Not Found</h2><p class="muted mb20">Code "${esc(A.pendingCode)}" did not match any group.</p><button class="btn" onclick="A.view='landing';render()">Go Back</button></div>`;return;}A.group=rows[0];A.entries=JSON.parse(rows[0].entries||"[]");A.assignments=JSON.parse(rows[0].group_assignments||"{}");A.orgVerified=false;A.orgPinInput="";A.orgPinErr="";A.sfDone=false;A.regroupPreview=null;A.signupMode="signup";resetSF();A.view="dashboard";render();}catch(e){R.innerHTML=sparkles()+`<div class="wrap" style="text-align:center;padding-top:80px"><div class="big-icon">⚠️</div><h2 style="font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:#C62828;margin-bottom:12px">Connection Error</h2><p class="muted mb20">${esc(e.message)}</p><button class="btn" onclick="A.view='landing';render()">Go Back</button></div>`;}
}
async function refreshGroup(){if(!A.group)return;try{const rows=await sbGet("groups",{code:A.group.code});if(rows[0]){A.group=rows[0];A.entries=JSON.parse(rows[0].entries||"[]");A.assignments=JSON.parse(rows[0].group_assignments||"{}");}}catch(e){}render();}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function vDashboard(){
  const g=A.group;const active=A.entries.filter(e=>e.status!=="Cancelled");
  const pending=active.filter(e=>e.cabinPending);const feGroups=JSON.parse(g.fe_groups||"[]");
  const isClosed=g.close_date&&new Date()>=new Date(g.close_date+"T12:00:00");
  const daysLeft=daysUntil(g.sail_date);
  const isSailed=g.sail_date&&new Date()>new Date(g.sail_date+"T23:59:00");
  const tabs=[
    {id:"guide",label:"📚 FE Guide"},
    {id:"signup",label:"🌟 Sign Up"},
    {id:"groups",label:"⛵ Our Voyage Groups"},
    {id:"roster",label:"🪄 Our Magic Crew ("+(active.length)+")"},
    {id:"pixie",label:"✨ Pixie Dust"},
  ].concat(isSailed?[{id:"reflection",label:"🎊 Reflection"}]:[])
  .concat([{id:"organizer",label:"🔧 Organizer"}]);
  let content="";
  try{
    if(A.tab==="signup")content=tSignup(feGroups,g,isClosed);
    else if(A.tab==="roster")content=tRoster(active);
    else if(A.tab==="groups")content=tShipCircles(active,feGroups,isClosed);
    else if(A.tab==="pixie")content=tPixie(active);
    else if(A.tab==="guide")content=tEtiquette();
    else if(A.tab==="reflection")content=tReflection(active,feGroups,g);
    else if(A.tab==="organizer")content=tOrganizer(active,feGroups,isClosed,g);
  }catch(tabErr){content=`<div class="card" style="color:#C62828;font-size:.85rem"><strong>Tab error (${A.tab}):</strong> ${tabErr.message}<br><small>Please screenshot this and share with the organizer.</small></div>`;}
  R.innerHTML=sparkles()+`<div class="wrap">
  <header style="text-align:center;padding:24px 0 14px">
    ${g.announcement?`<div class="announce-banner">📢 ${esc(g.announcement)}</div>`:""}
    <div class="ship-name">${esc(g.ship)}</div>
    <div class="ship-meta">${fmtD(g.sail_date)}${g.itinerary?" · "+esc(g.itinerary):""}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:5px;flex-wrap:wrap">
      <span style="font-family:'Cinzel',serif;font-size:.67rem;color:rgba(0,26,62,.82)">Code: ${esc(g.code)}</span>
      <button class="btn-sm" style="padding:3px 8px;font-size:.61rem" onclick="copyCode()">Copy Code</button>
      <button class="btn-sm" style="padding:3px 8px;font-size:.61rem;background:rgba(0,26,62,.04);border-color:rgba(255,255,255,.12)" onclick="refreshGroup()">↻ Refresh</button>
    </div>
    ${daysLeft!==null?`<div class="countdown">${daysLeft>0?daysLeft+" days until we sail":"Bon Voyage! 🚢"}</div>`:""}
    ${g.close_date?`<div style="font-size:.63rem;color:${isClosed?"#EF5350":daysUntil(g.close_date)!==null&&daysUntil(g.close_date)<=7?"#FFA726":daysUntil(g.close_date)!==null&&daysUntil(g.close_date)<=14?"#FFCC02":"#66BB6A"};margin-top:3px">${isClosed?"Sign-ups closed":daysUntil(g.close_date)+" days until sign-ups close · "+fmtD(g.close_date)}</div>`:""}
    ${g.facebook_link?`<div style="margin-top:4px"><a href="${esc(g.facebook_link)}" target="_blank" style="font-size:.66rem;color:rgba(0,26,62,.82);text-decoration:none">🔗 Facebook Group</a></div>`:""}
    <div style="margin-top:5px"><button class="btn-sm" style="padding:3px 8px;font-size:.61rem;background:rgba(102,187,106,.15);border-color:#2E7D32;color:#2E7D32" onclick="copyShareLink()">🔗 Copy Sign-Up Link</button></div>
  </header>
  <div class="tabs">${tabs.map(t=>`<button class="tab${A.tab===t.id?" on":""}" onclick="switchTab('${t.id}')">${t.label}</button>`).join("")}</div>
  ${content}
</div>`;
}
function switchTab(t){try{A.tab=t;if(t!=="signup"){A.signupMode="signup";A.sfDone=false;}if(t!=="groups"){A.circleSearch="";A.circleSearchActive=false;}if(t!=="roster"){A.rosterPending=false;}vDashboard();refreshGroup();}catch(e){alert("Tab switch error: "+e.message);}}
function copyCode(){try{navigator.clipboard.writeText(A.group.code);}catch{}alert("Code copied: "+A.group.code);}
function tapCopyCode(){
  try{navigator.clipboard.writeText(A.group.code);}catch{}
  const el=document.getElementById('codeDisplay');
  if(el){const prev=el.textContent;el.textContent='✓ Copied!';el.style.color='#2E7D32';setTimeout(()=>{el.textContent=prev;el.style.color='';},2000);}
}
function copyShareLink(){const link=getShareLink();try{navigator.clipboard.writeText(link);}catch{}alert("Sign-up link copied! Share it directly — no code entry needed.");}

// ── SIGN UP TAB ────────────────────────────────────────────────────────────
function resetSF(){A.sf={cabin:"",isGTY:false,deckGroups:[],feGroups:[],adults:"1",children:"0",notes:"",celebration:"",celebOther:"",celebDate:"",pixieOk:false,firstTimer:false};A.sfGuests=[{name:"",pronouns:"",isChild:false,age:"",character:"",movie:"",color:""}];A.sfErr={};A.sfDone=false;A.sfStep=1;A.manageSearch="";A.manageEntry=null;A.manageAction=null;A.manageCabin="";A.manageDeck=[];A.manageMsg="";A.manageErr="";}

function stepBar(cur){
  const steps=[{n:1,l:"Groups"},{n:2,l:"Party"},{n:3,l:"Stateroom"}];
  return '<div class="step-bar">'+steps.map((s,i)=>{
    const cls=s.n<cur?"done":s.n===cur?"active":"";
    return (i>0?'<div class="step-line'+(s.n<=cur?" done":"")+'"></div>':'')+'<div class="step-dot '+cls+'">'+s.n+'</div>';
  }).join('')+'<div style="font-size:.65rem;color:rgba(0,26,62,.78);margin-left:6px">Step '+cur+' of 3</div></div>';
}
function tSignup(feGroups,g,isClosed){
  if(A.signupMode==="manage")return tManage();
  if(isClosed)return`<div class="card" style="text-align:center;padding:28px"><div style="font-size:38px;margin-bottom:10px">🔒</div><p class="muted mb12">Sign-ups are closed for this sailing.</p><button class="btn-gold" onclick="A.signupMode='manage';vDashboard()">🔧 Manage My Sign-Up</button></div>`;
  if(A.sfDone)return`<div class="card" style="text-align:center;padding:32px"><div class="big-icon">🎉</div><h2 style="font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:#001A3E;margin-bottom:12px">You're In!</h2><p class="muted mb14">Check Roster and Groups tabs to see your stateroom.</p><div id="confEl" style="background:rgba(0,26,62,.03);border:1.5px solid rgba(201,146,42,.2);border-radius:10px;padding:12px;font-size:.79rem;line-height:1.72;margin-bottom:10px;text-align:left;white-space:pre-wrap;user-select:all">${esc(buildConfirmText())}</div><button class="btn-sm" id="confBtn" style="width:100%;margin-bottom:10px" onclick="copyEl('confEl','confBtn','📋 Copy Confirmation')">📋 Copy & Post in Facebook Group</button><button class="btn" onclick="switchTab('roster')">View Roster</button></div>`;
  const now=new Date();
  const mainClosed=g.close_date&&now>=new Date(g.close_date+'T00:00:00');
  const allAboardOpen=mainClosed&&(!g.late_close_date||now<=new Date(g.late_close_date+'T23:59:00'));
  const pixieOpen=!g.pixie_close_date||now<=new Date(g.pixie_close_date+'T23:59:00');
  const hasFE=A.sf.feGroups.some(id=>id!=="pixiedust");
  const isPixieOnly=A.sf.feGroups.length>0&&A.sf.feGroups.every(id=>id==="pixiedust");
  const errs=A.sfErr;const a=Math.max(0,parseInt(A.sf.adults)||0),c=Math.max(0,parseInt(A.sf.children)||0);
  let feRows="";
  feGroups.filter(fg=>fg.active&&(!fg.isLate||mainClosed)).forEach(fg=>{
    const sel=A.sf.feGroups.includes(fg.id);const minTxt=fg.isPixie?"No minimum":"Min $"+fg.minGift+" per gift";
    feRows+=`<div class="fe-row${sel?" on":""}" onclick="toggleSF('feGroups','${fg.id}')"><span style="font-size:17px;flex-shrink:0">${fg.icon}</span><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:.81rem;color:${sel?"#001A3E":"rgba(0,26,62,.68)"};font-family:'Cinzel',serif;margin-bottom:2px">${fg.name}</div><div style="font-size:.62rem;color:rgba(0,26,62,.78);margin-bottom:2px">${fg.desc}</div><div style="font-size:.6rem;font-weight:700;color:${sel?"#6B4C00":"rgba(0,26,62,.65)"}">${minTxt}</div></div><div class="fe-check${sel?" on":""}">${sel?"✓":""}</div></div>`;
  });
  let deckHTML=DECKS.map(d=>{const sel=A.sf.deckGroups.includes(d.id);const dis=A.sf.isGTY&&d.id!=="any";return`<div class="deck-tile${sel?" on":""}${dis?" dis":""}" onclick="${dis?"":"toggleSF('deckGroups','"+d.id+"')"}"><span style="font-size:18px">${d.icon}</span><div><div style="font-weight:700;font-size:.74rem;color:${sel?"#C9922A":"#001A3E"};font-family:'Cinzel',serif;line-height:1.3">${d.name}</div><div style="font-size:.6rem;color:rgba(0,26,62,.78);margin-top:2px">${d.decks}</div></div></div>`;}).join("");
  let guestHTML="";
  for(let i=0;i<a+c;i++){const gi=A.sfGuests[i]||{name:"",pronouns:"",isChild:i>=a,age:"",character:"",movie:"",color:""};const lbl=gi.isChild?"Child "+(i-a+1):"Adult "+(i+1);guestHTML+=`<div class="guest-box"><div style="font-family:'Cinzel',serif;font-size:.65rem;color:rgba(0,26,62,.84);margin-bottom:9px;display:flex;justify-content:space-between"><span>${lbl}</span>${gi.isChild?`<span style="color:#CE93D8">CHILD</span>`:""}</div><div class="guest-grid"><div class="guest-full"><label class="label">Name *</label><input class="input-sm" placeholder="${lbl} name" value="${esc(gi.name)}" onchange="updGuest(${i},'name',this.value)"/><span class="err">${errs["g"+i]||""}</span></div><div><label class="label">Pronouns</label><input class="input-sm" placeholder="she/her" value="${esc(gi.pronouns)}" onchange="updGuest(${i},'pronouns',this.value)"/></div>${gi.isChild?`<div><label class="label">Age</label><input type="number" class="input-sm" placeholder="5" value="${esc(gi.age)}" onchange="updGuest(${i},'age',this.value)"/></div>`:`<div></div>`}<div><label class="label">Fav Character</label><input class="input-sm" placeholder="Moana..." value="${esc(gi.character)}" onchange="updGuest(${i},'character',this.value)"/></div><div><label class="label">Fav Movie</label><input class="input-sm" placeholder="Encanto..." value="${esc(gi.movie)}" onchange="updGuest(${i},'movie',this.value)"/></div><div class="guest-full"><label class="label">Favorite Color</label><input class="input-sm" placeholder="Purple..." value="${esc(gi.color)}" onchange="updGuest(${i},'color',this.value)"/></div></div></div>`;}
  return`
  <div style="margin-bottom:10px"><button class="btn-gold" onclick="A.signupMode='manage';vDashboard()">🔧 Manage My Sign-Up <span style="font-size:.65rem;opacity:.7">· For removal or cabin/information updates</span></button></div>
  <div class="card"><div class="card-title">Fish Extender Groups *</div>${feRows}
    ${A.sf.feGroups.includes("pixiedust")?`<div class="check-row" onclick="A.sf.pixieOk=!A.sf.pixieOk;vDashboard()"><div class="checkbox${A.sf.pixieOk?" on":""}">${A.sf.pixieOk?"✓":""}</div><div style="font-size:.77rem;color:rgba(0,26,62,.78);line-height:1.4">I understand Pixie Dust is casual — no groups, no expectations, just magic.</div></div>`:""}
    <span class="err">${errs.feGroups||""}</span><span class="err">${errs.pixieOk||""}</span>
  </div>
  ${hasFE?`
  <div class="card"><div class="card-title">Your Party</div>
    <div class="grid2"><div><label class="label">Adults *</label><input type="number" class="input" value="${esc(A.sf.adults)}" min="0" onchange="updParty('adults',this.value)"/><span class="err">${errs.adults||""}</span></div><div><label class="label">Children</label><input type="number" class="input" value="${esc(A.sf.children)}" min="0" onchange="updParty('children',this.value)"/></div></div>${guestHTML}
  </div>
  <div class="card"><div class="card-title">Celebrating? <span style="font-size:.57rem;color:rgba(0,26,62,.78);font-weight:400">OPTIONAL</span></div>
    <div style="margin-bottom:9px">${CELEBS.map(cc=>`<span class="celeb-pill${A.sf.celebration===cc.id?" on":""}" onclick="A.sf.celebration=A.sf.celebration==='${cc.id}'?'':'${cc.id}';vDashboard()">${cc.icon} ${cc.name}</span>`).join("")}</div>
    ${A.sf.celebration==="other"?`<div class="mb8"><label class="label">What are you celebrating?</label><input class="input" placeholder="Retirement..." value="${esc(A.sf.celebOther)}" onchange="A.sf.celebOther=this.value"/></div>`:""}
    ${A.sf.celebration?`<div><label class="label">Date of Celebration</label><input type="text" class="input" placeholder="MM/DD/YYYY" value="${esc(toMDY(A.sf.celebDate))}" oninput="autoSlash(this);A.sf.celebDate=toYMD(this.value)" maxlength="10" autocomplete="off"/></div>`:""}
  </div>
  <div class="card"><div class="card-title">Stateroom</div>
    <div class="mb10"><label class="label">Cabin Number *</label>${A.sf.isGTY?`<span class="hint">GTY — update cabin via Manage My Sign-Up once assigned</span>`:`<span class="hint">Required — or check GTY below</span>`}<input class="input" placeholder="e.g. 9284" value="${esc(A.sf.cabin)}" ${A.sf.isGTY?"disabled":""} onchange="A.sf.cabin=this.value" style="${A.sf.isGTY?"opacity:.3":""}"/><span class="err">${errs.cabin||""}</span></div>
    <div class="check-row mb12" onclick="toggleGTY()"><div class="checkbox${A.sf.isGTY?" on":""}">${A.sf.isGTY?"✓":""}</div><div><div style="font-size:.82rem;font-weight:700;color:#001A3E;font-family:'Cinzel',serif">I booked a GTY (Guarantee) room</div><div style="font-size:.64rem;color:rgba(0,26,62,.78);margin-top:2px">No cabin yet — update via Manage My Sign-Up when Disney assigns it.</div></div></div>
    <label class="label">Deck Group(s) *</label><span class="hint">Select all that apply — choose one or more</span>
    <div class="deck-grid">${deckHTML}</div><span class="err">${errs.deckGroups||""}</span>
  </div>`:""}
  ${isPixieOnly?`<div class="card mb12"><label class="label">Your Name(s)</label><span class="hint">Optional but appreciated</span><input class="input" placeholder="Name(s)" value="${esc((A.sfGuests[0]||{}).name||"")}" onchange="updGuest(0,'name',this.value)"/></div>`:""}
  <div class="card mb12"><label class="label">Anything else?</label><textarea class="input" placeholder="First Disney cruise, notes..." onchange="A.sf.notes=this.value">${esc(A.sf.notes)}</textarea></div>
    <div class="check-row mb10" onclick="A.sf.firstTimer=!A.sf.firstTimer;vDashboard()"><div class="checkbox${A.sf.firstTimer?' on':''}">${A.sf.firstTimer?'&#10003;':''}</div><div><div style="font-size:.82rem;font-weight:700;color:#001A3E;font-family:'Cinzel',serif">&#10024; This is my first Disney cruise!</div><div style="font-size:.65rem;color:rgba(0,26,62,.82);margin-top:2px">Let your group know &mdash; first-timers get extra pixie dust!</div></div></div>
  ${(A.extraCabins||[]).length>0?`<div style="margin-bottom:12px"><div style="font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;color:#001A3E;margin-bottom:8px">Additional Cabins</div>${(A.extraCabins||[]).map((ec,ei)=>`<div style="background:rgba(0,26,62,.03);border:1px solid rgba(107,76,0,.15);border-radius:12px;padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-family:'Cinzel',serif;font-size:.78rem;font-weight:700;color:#001A3E">Cabin ${ei+2}</span><button onclick="A.extraCabins=A.extraCabins.filter((_,i)=>i!==${ei});vDashboard()" style="background:none;border:none;color:#C62828;font-size:.8rem;cursor:pointer">&#10005; Remove</button></div><input class="input mb8" placeholder="Cabin # (e.g. 9284)" value="${esc(ec.cabin||'')}" oninput="A.extraCabins[${ei}].cabin=this.value"/>${(ec.guests||[{name:''},{name:''}]).map((eg,egi)=>`<input class="input mb6" placeholder="Guest ${egi+1} name" value="${esc(eg.name||'')}" oninput="A.extraCabins[${ei}].guests[${egi}].name=this.value"/>`).join('')}<button onclick="A.extraCabins[${ei}].guests=[...(A.extraCabins[${ei}].guests||[]),{name:'',isChild:false}];vDashboard()" style="font-size:.72rem;color:rgba(0,26,62,.6);background:none;border:none;cursor:pointer;padding:0">+ Add guest</button></div>`).join('')}</div>`:''}
  <button onclick="A.extraCabins=[...(A.extraCabins||[]),{cabin:'',guests:[{name:'',isChild:false},{name:'',isChild:false}]}];vDashboard()" style="width:100%;padding:10px;background:rgba(0,26,62,.04);border:1.5px dashed rgba(107,76,0,.3);border-radius:12px;font-family:'Cinzel',serif;font-size:.76rem;color:rgba(0,26,62,.65);cursor:pointer;margin-bottom:10px">&#43; Add Another Cabin to This Sign-Up</button>
  <button class="btn mb8" onclick="submitSF()" ${A.saving?"disabled":""} style="${A.saving?"opacity:.6":""}">${A.saving?"Saving...":"✨ Join the Fish Extender Exchange"}</button>
  <button class="btn-ghost" onclick="switchTab('roster')">Back to Roster</button>`;
}

// ── MANAGE SIGN-UP FLOW ────────────────────────────────────────────────────
function tManage(){
  const g=A.group;const e=A.manageEntry;
  const isClosed=g.close_date&&new Date()>=new Date(g.close_date+'T12:00:00');
  const feGroupCfg=JSON.parse(g.fe_groups||'[]');

  let html=`<div style="margin-bottom:10px"><button class="btn-ghost" onclick="A.signupMode='signup';vDashboard()">&#8592; Back to Sign Up</button></div>
  <div class="card"><div class="card-title">&#128295; Manage My Sign-Up</div>
  ${isClosed?`<div style="background:rgba(198,40,40,.07);border:1px solid rgba(198,40,40,.25);border-radius:10px;padding:9px 12px;font-size:.73rem;color:#C62828;margin-bottom:12px">Sign-ups are closed. You can update your cabin number or remove yourself.</div>`:''}`;

  if(!e){
    html+=`<p class="muted mb12" style="font-size:.78rem">Enter the name you signed up with to find your entry.</p>
    <label class="label">Your Name or Cabin Number</label>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="mgNameIn" class="input" placeholder="Name or cabin #" value="${esc(A.manageSearch)}"/>
      <button class="btn-sm" onclick="searchManage()">Find</button>
    </div>
    <span class="err">${esc(A.manageErr)}</span>`;
    return html+'</div>';
  }

  const names=(e.guests||[]).map(g=>g.name).filter(Boolean).join(', ')||'(no names)';
  const cabin=e.cabinPending?'GTY/TBD':'Cabin '+(e.cabin||'TBD');
  const fgNames=(e.feGroups||[]).map(id=>{const f=feGroupCfg.find(x=>x.id===id);return f?f.name:id;}).join(', ')||'None selected';
  const dgNames=(e.deckGroups||[]).filter(d=>d!=='any').map(d=>'Deck '+d).join(', ')||'Any Deck';

  html+=`<div class="manage-card">
    <div style="font-weight:700;font-size:.9rem;color:#001A3E;font-family:'Cinzel',serif;margin-bottom:2px">${esc(names)}</div>
    <div style="font-size:.7rem;color:rgba(0,26,62,.65);margin-bottom:6px">${esc(cabin)}</div>
    <div style="font-size:.68rem;color:rgba(0,26,62,.6);margin-bottom:3px">FE Groups: <strong>${esc(fgNames)}</strong></div>
    <div style="font-size:.68rem;color:rgba(0,26,62,.6);margin-bottom:12px">Deck Pref: <strong>${esc(dgNames)}</strong></div>
    ${A.manageMsg?`<div style="color:#2E7D32;font-size:.78rem;font-weight:700;margin-bottom:10px">${esc(A.manageMsg)}</div>`:''}
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn-sm" style="width:100%" onclick="A.manageAction=A.manageAction==='cabin'?null:'cabin';A.manageCabin=A.manageEntry.cabin||'';A.manageErr='';vDashboard()">&#127968; Update Cabin Number</button>
      ${!isClosed?`
      <button class="btn-sm" style="width:100%;background:rgba(0,26,62,.07);border-color:rgba(0,26,62,.2);color:#001A3E" onclick="A.manageAction=A.manageAction==='groups'?null:'groups';A.manageFeGroups=[...(A.manageEntry.feGroups||[])];A.manageDeckGroups=[...(A.manageEntry.deckGroups||[])];A.manageErr='';vDashboard()">&#9875; Change Groups &amp; Deck Preferences</button>
      <button class="btn-sm" style="width:100%;background:rgba(0,26,62,.07);border-color:rgba(0,26,62,.2);color:#001A3E" onclick="A.manageAction=A.manageAction==='guests'?null:'guests';A.manageErr='';vDashboard()">&#128101; Edit Guest Names</button>`:''}
      <button class="btn-sm" style="width:100%;background:rgba(239,83,80,.08);border-color:rgba(198,40,40,.5);color:#C62828" onclick="A.manageAction=A.manageAction==='remove'?null:'remove';vDashboard()">&#10005; Remove Me from Group</button>
    </div>
  </div>`;

// ── PIXIE DUST ─────────────────────────────────────────────────────────────
function tPixie(active){

// ── MY ASSIGNMENT ──────────────────────────────────────────────────────────
function tMyAssign(active,feGroups){
  const q=(A.searchQuery||"").toLowerCase();
  let html=`<div class="card"><div class="card-title">🔍 Find My Assignment</div><input class="input" placeholder="Enter your name..." value="${esc(A.searchQuery)}" oninput="A.searchQuery=this.value;vDashboard()"/></div>`;
  if(!q)return html;
  const matched=active.filter(e=>(e.guests||[]).some(g=>g.name.toLowerCase().includes(q)));
  if(!matched.length)return html+`<div class="card" style="text-align:center;padding:20px;color:rgba(0,26,62,.78)">No match found. Check spelling or contact your organizer.</div>`;
  const dg=getGroupsForDisplay(active,feGroups,A.assignments);
  matched.forEach(entry=>{
    const myName=(entry.guests||[]).map(g=>g.name).filter(Boolean).join(", ");const cabin=entry.cabinPending?"GTY/TBD":"Cabin "+entry.cabin;
    html+=`<div class="assign-card"><div style="font-family:'Cinzel Decorative',serif;font-size:1rem;color:#001A3E;margin-bottom:3px">${esc(myName)}</div><div style="font-size:.71rem;color:rgba(0,26,62,.78);margin-bottom:14px">${esc(cabin)}</div>`;
    feGroups.filter(fg=>!fg.isPixie&&fg.active&&(entry.feGroups||[]).includes(fg.id)).forEach(fg=>{const gs=dg[fg.id]||[];const myGroup=gs.find(g=>g.memberIds.includes(entry.id));if(myGroup){html+=`<div style="margin-bottom:12px"><div style="font-size:.64rem;color:rgba(0,26,62,.84);font-family:'Cinzel',serif;margin-bottom:5px">${fg.icon} ${fg.name}</div><div class="assign-group-name">${esc(myGroup.name)}</div><div style="font-size:.73rem;color:rgba(0,26,62,.76);line-height:1.7">${myGroup.members.map(m=>`${(m.guests||[]).map(x=>x.name).filter(Boolean).join(", ")||"Anonymous"} · ${m.cabinPending?"GTY/TBD":"Cabin "+m.cabin}`).join("<br>")}</div></div>`;}});
    if((entry.feGroups||[]).includes("pixiedust")){html+=`<div style="font-size:.75rem;color:#001A3E;margin-top:4px">✨ Pixie Dust — spread magic your way!</div>`;}
    html+="</div>";
  });
  return html;
}

 solid rgba(107,76,0,.12);border-radius:10px;padding:9px 11px;text-decoration:none;margin-bottom:6px"><span style="font-size:1rem">&#129534;</span><div style="flex:1"><div style="font-family:Cinzel,serif;font-size:.72rem;font-weight:700;color:#001A3E">Pixie Dusting Tips and Tricks</div><div style="font-size:.65rem;color:rgba(0,26,62,.7);margin-top:1px">What people actually love to receive</div></div><span style="color:rgba(0,26,62,.4);font-size:.75rem">&#8599;</span></a><a href="https://www.pinterest.com/ideas/disney-cruise-pixie-dust-ideas/897270677775/" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;background:rgba(0,26,62,.03);border:1.5px solid rgba(107,76,0,.12);border-radius:10px;padding:9px 11px;text-decoration:none"><span style="font-size:1rem">&#128204;</span><div style="flex:1"><div style="font-family:Cinzel,serif;font-size:.72rem;font-weight:700;color:#001A3E">Pinterest — Pixie Dust Ideas</div><div style="font-size:.65rem;color:rgba(0,26,62,.7);margin-top:1px">Hundreds of creative ideas to spark your magic</div></div><span style="color:rgba(0,26,62,.4);font-size:.75rem">&#8599;</span></a></div></div>`:''}</div>`;

async function updateToLatestDefaults(){

  const updated=current.map(fg=>{

    if(!def)return fg;
    return {...fg,name:def.name,icon:def.icon,desc:def.desc};

    A.group.fe_groups=JSON.stringify(updated);_editFEGroups=null;
    alert('Stock groups updated to latest defaults!');

  vDashboard();
}

function getEditFE(){if(!_editFEGroups)_editFEGroups=JSON.parse(A.group.fe_groups||'[]').map(f=>({...f}));return _editFEGroups;}
function toggleEditFE(i){const fgs=getEditFE();fgs[i].active=!fgs[i].active;_editFEGroups=fgs;A.orgTab='editfe';vDashboard();}
function updateEditFE(i,k,v){const fgs=getEditFE();fgs[i][k]=k==='cap'?parseInt(v)||5:k==='minGift'?parseFloat(v)||0:v;_editFEGroups=fgs;}
function removeEditFE(i,memberCount){
  const fgs=getEditFE();const fg=fgs[i];
  const active=(A.entries||[]).filter(e=>e.status!=='Cancelled'&&(e.feGroups||[]).includes(fg.id));
  if(active.length){if(!confirm('WARNING: '+active.length+' member(s) are signed up for this group. Removing it will not notify them. Continue?'))return;}


  else{if(!confirm('Remove '+fg.name+'? This cannot be undone.'))return;}
  fgs.splice(i,1);_editFEGroups=fgs;A.orgTab='editfe';vDashboard();
}
function addEditFE(){
  const name=(document.getElementById('editcust_name')?.value||'').trim();
  const desc=(document.getElementById('editcust_desc')?.value||'').trim();
  const cap=parseInt(document.getElementById('editcust_cap')?.value)||5;
  const minGift=parseFloat(document.getElementById('editcust_min')?.value)||15;
  if(!name){alert('Enter a group name.');return;}
  const fgs=getEditFE();
  fgs.push({id:'custom_'+Date.now(),name,icon:'&#127873;',desc:desc||'Custom exchange',cap,minGift,active:true,isPixie:false,isLate:false,isCustom:true});
  _editFEGroups=fgs;A.orgTab='editfe';vDashboard();
}
async function saveEditFE(){
  const fgs=getEditFE();if(!fgs)return;
  try{
    await sbPatch('groups',{code:A.group.code},{fe_groups:JSON.stringify(fgs)});
    A.group.fe_groups=JSON.stringify(fgs);_editFEGroups=null;
    alert('Exchange settings saved!');
  }catch(e){alert('Error saving: '+e.message);}
  vDashboard();
}
function orgAnnounce(g){return`<p class="muted mb10" style="font-size:.75rem">Post an announcement visible at the top of the dashboard for all members.</p><textarea class="input mb8" style="min-height:80px" placeholder="Type your announcement..." oninput="A.announcementDraft=this.value">${esc(A.announcementDraft||g.announcement||"")}</textarea><div style="display:flex;gap:8px"><button class="btn-sm" onclick="saveAnnouncement()" style="flex:1">Post</button><button class="btn-sm" onclick="clearAnnouncement()" style="flex:1;background:rgba(0,26,62,.04);border-color:rgba(255,255,255,.12);color:rgba(0,26,62,.78)">Clear</button></div>`;}
async function saveAnnouncement(){const txt=(A.announcementDraft||"").trim();try{await sbPatch("groups",{code:A.group.code},{announcement:txt});A.group.announcement=txt;alert("Posted!");}catch(e){alert("Error: "+e.message);}vDashboard();}
async function clearAnnouncement(){try{await sbPatch("groups",{code:A.group.code},{announcement:""});A.group.announcement="";A.announcementDraft="";}catch(e){alert("Error: "+e.message);}vDashboard();}

function orgRegroup(active,feGroups,isClosed){
  if(isClosed)return`<div class="warn-box">Sign-ups are closed. Groups are locked.</div>`;
  const dfe=feGroups.filter(fg=>!fg.isPixie&&fg.active);
  if(A.regroupPreview){
    const isAll=A.regroupFEId==="all";let html=`<div class="info-box mb10">Preview ${isAll?"for all groups":"for "+dfe.find(f=>f.id===A.regroupFEId)?.name||""} — review before confirming.</div>`;
    const preview=isAll?Object.values(A.regroupPreviewFull||{}).flat():A.regroupPreview;
    preview.forEach(grp=>{const dl={"sorcerer":"🎩","hero":"⚡","brave":"🏹","legends":"⚔️","any":"🌊"}[grp.primaryDeck]||"";html+=`<div class="group-box"><div class="group-name-hdr"><span>${esc(grp.name)}</span><span style="font-size:.59rem;color:rgba(0,26,62,.82)">${dl} · ${grp.memberIds.length} cabins</span></div>${grp.memberIds.map(id=>{const e=active.find(x=>x.id===id);if(!e)return"";const names=(e.guests||[]).map(g=>g.name).filter(Boolean).join(", ");const cabin=e.cabinPending?"GTY/TBD":"Cabin "+e.cabin;return`<div class="group-member"><span style="font-size:.8rem;color:#001A3E;font-family:'Cinzel',serif">${esc(names)}</span><span style="font-size:.67rem;color:#001A3E">${esc(cabin)}</span></div>`;}).join("")}</div>`;});
    html+=`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn-green" onclick="confirmRegroup()">✓ Confirm & Apply</button><button class="btn-ghost" onclick="A.regroupPreview=null;vDashboard()">Cancel</button></div>`;return html;
  }
  return`<p class="muted mb12" style="font-size:.76rem">Smart Regroup anchors deck-matched members and only moves GTY/No Preference guests to fill gaps. Preview before applying.</p><div class="mb10"><label class="label">Select FE Group</label><select class="input mb8" id="rgFE"><option value="">All groups at once</option>${dfe.map(fg=>`<option value="${fg.id}">${fg.icon} ${fg.name}</option>`).join("")}</select><button class="btn-sm" style="width:100%" onclick="previewRegroup()">🔄 Preview Smart Regroup</button></div>`;
}
function previewRegroup(){const feId=document.getElementById("rgFE")?.value;const feGroups=JSON.parse(A.group.fe_groups||"[]");const active=A.entries.filter(e=>e.status!=="Cancelled");if(!feId){previewFullRegroup();return;}const fg=feGroups.find(f=>f.id===feId);if(!fg)return;A.regroupPreview=smartRegroup(active,fg,A.assignments[feId]||[]);A.regroupFEId=feId;vDashboard();}
function previewFullRegroup(){const feGroups=JSON.parse(A.group.fe_groups||"[]");const active=A.entries.filter(e=>e.status!=="Cancelled");const all={};feGroups.filter(fg=>!fg.isPixie&&fg.active).forEach(fg=>{all[fg.id]=smartRegroup(active,fg,A.assignments[fg.id]||[]);});A.regroupPreviewFull=all;A.regroupPreview=Object.values(all).flat();A.regroupFEId="all";vDashboard();}
async function confirmRegroup(){try{let na={...A.assignments};if(A.regroupFEId==="all"&&A.regroupPreviewFull)na=A.regroupPreviewFull;else if(A.regroupFEId)na[A.regroupFEId]=A.regroupPreview;await sbPatch("groups",{code:A.group.code},{group_assignments:JSON.stringify(na)});A.assignments=na;A.regroupPreview=null;A.regroupFEId=null;alert("Groups updated!");}catch(e){alert("Error: "+e.message);}vDashboard();}

function orgCelebCoord(active,g){
  if(!g.sail_date){return '<p class="muted">Set a sail date on your group to see celebration coordination.</p>';}
  const sailStart=new Date(g.sail_date+"T12:00:00");
  const sailReturn=g.return_date?new Date(g.return_date+"T12:00:00"):new Date(sailStart.getTime()+7*86400000);
  const days=Math.round((sailReturn-sailStart)/86400000);
  const celebEntries=active.filter(e=>e.celebration&&e.celebrationDate);
  if(!celebEntries.length)return '<p class="muted" style="font-size:.78rem">No celebration dates recorded yet.</p>';
  let html='<p class="muted mb10" style="font-size:.76rem">Coordinate Pixie Dust deliveries and special moments for celebrating guests.</p>';
  const byDay={};
  celebEntries.forEach(e=>{
    const d=new Date(e.celebrationDate+"T12:00:00");
    const diff=Math.round((d-sailStart)/86400000);
    if(diff>=0&&diff<days){
      const key="Day "+(diff+1)+" — "+d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
      if(!byDay[key])byDay[key]=[];
      const celeb=CELEBS.find(c=>c.id===e.celebration);
      const names=(e.guests||[]).map(x=>x.name).filter(Boolean).join(", ")||"Anonymous";
      const cabin=e.cabinPending?"GTY/TBD":"Cabin "+(e.cabin||"TBD");
      byDay[key].push({names,cabin,celeb,other:e.celebrationOther});
    }
  });
  const noDate=celebEntries.filter(e=>{const d=new Date(e.celebrationDate+"T12:00:00");const diff=Math.round((d-sailStart)/86400000);return diff<0||diff>=days;});
  if(!Object.keys(byDay).length&&!noDate.length){html+='<p class="muted" style="font-size:.75rem">No celebration dates fall within the sailing window.</p>';return html;}
  Object.entries(byDay).sort().forEach(([day,items])=>{
    html+='<div style="margin-bottom:12px"><div style="font-family:Cinzel,serif;font-size:.78rem;font-weight:700;color:var(--gold);margin-bottom:7px">'+esc(day)+'</div>';
    items.forEach(item=>{html+='<div style="background:rgba(0,26,62,.03);border:1.5px solid rgba(201,146,42,.15);border-radius:10px;padding:9px 12px;margin-bottom:5px"><div style="font-weight:700;font-size:.83rem;color:#001A3E;font-family:Cinzel,serif">'+esc(item.names)+'</div><div style="font-size:.68rem;color:rgba(0,26,62,.82);margin-top:2px">'+esc(item.cabin)+' · '+(item.celeb?item.celeb.icon+' '+item.celeb.name:'')+(item.other?' — '+esc(item.other):'')+'</div></div>';});
    html+='</div>';
  });
  if(noDate.length){html+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,26,62,.1)"><div style="font-size:.7rem;color:rgba(0,26,62,.78);margin-bottom:7px">Celebrations outside sailing window or no date set:</div>';noDate.forEach(e=>{const names=(e.guests||[]).map(x=>x.name).filter(Boolean).join(", ")||"Anonymous";const celeb=CELEBS.find(c=>c.id===e.celebration);html+='<div style="font-size:.75rem;color:rgba(0,26,62,.78);padding:4px 0">'+esc(names)+' · '+(celeb?celeb.name:'')+(e.celebrationDate?' · '+fmtD(e.celebrationDate):'')+'</div>';});html+='</div>';}
  return html;
}
function orgGiftTags(active,feGroups,g){
  const dg=getGroupsForDisplay(active,feGroups,A.assignments);
  let html='<p class="muted mb10" style="font-size:.76rem">Generate gift tags for each group. Members can screenshot or print these for their gifts.</p>';
  feGroups.filter(fg=>!fg.isPixie&&fg.active).forEach(fg=>{
    const gs=dg[fg.id]||[];if(!gs.length)return;
    html+='<div style="margin-bottom:16px"><div style="font-family:Cinzel,serif;font-size:.8rem;font-weight:700;color:var(--gold);margin-bottom:8px">'+fg.icon+' '+fg.name+'</div>';
    gs.forEach(grp=>{
      const cabs=grp.members.map(m=>m.cabinPending?"GTY/TBD":"Cabin "+(m.cabin||"TBD")).join(" · ");
      html+='<div class="gift-tag"><div class="gift-tag-title">'+esc(grp.name)+'</div><div class="gift-tag-line">'+esc(fg.icon+' '+fg.name)+'</div><div class="gift-tag-line" style="font-size:.68rem;color:rgba(0,26,62,.82);">'+esc(cabs)+'</div><div style="font-size:.6rem;color:rgba(0,26,62,.78);margin-top:5px;font-family:Lato,sans-serif">'+esc(fg.rule||fg.desc)+' · Min $'+fg.minGift+'</div></div>';
    });
    html+='</div>';
  });
  return html||'<p class="muted">No groups formed yet.</p>';
}
function orgReport(active,feGroups,g){
  const dg=getGroupsForDisplay(active,feGroups,A.assignments);
  const lines=["PIXIE DUST MAGIC MANAGER — FULL GROUP REPORT","=".repeat(50),g.ship+" · "+fmtD(g.sail_date)+(g.itinerary?" · "+g.itinerary:""),"Generated: "+new Date().toLocaleDateString(),"","SUMMARY","Total Staterooms: "+active.length,"Total Guests: "+active.reduce((s,e)=>(e.guests||[]).length+s,0),"Pending Cabins: "+active.filter(e=>e.cabinPending).length,"","GROUP ASSIGNMENTS","=".repeat(40)];
  feGroups.filter(fg=>!fg.isPixie&&fg.active).forEach(fg=>{
    const gs=dg[fg.id]||[];lines.push("","["+fg.name.toUpperCase()+"]","Rule: "+fg.desc+" · Min $"+fg.minGift);
    gs.forEach(grp=>{lines.push("  "+grp.name+":");grp.members.forEach(m=>{const names=(m.guests||[]).map(x=>x.name).filter(Boolean).join(", ");const cabin=m.cabinPending?"GTY/TBD":"Cabin "+m.cabin;lines.push("    - "+names+" ("+cabin+")"+(m.firstTimer?" ✨FIRST TIMER":""));});});
  });
  const pixie=active.filter(e=>(e.feGroups||[]).includes("pixiedust"));
  if(pixie.length){lines.push("","[PIXIE DUST ROSTER]");pixie.forEach(e=>{const names=(e.guests||[]).map(x=>x.name).filter(Boolean).join(", ")||"Anonymous";const cabin=e.cabinPending?"GTY/TBD":"Cabin "+e.cabin;lines.push("  - "+names+" ("+cabin+")"+(e.firstTimer?" ✨FIRST TIMER":""));});}
  lines.push("","PENDING CABINS","=".repeat(40));
  active.filter(e=>e.cabinPending).forEach(e=>{const names=(e.guests||[]).map(x=>x.name).filter(Boolean).join(", ")||"Anonymous";lines.push("  "+names+" — "+((e.feGroups||[]).join(", ")));});
  const txt=lines.join("\n");
  const rptHtml='<p class="muted mb10" style="font-size:.76rem">Complete group report. Copy and save as a backup reference.</p>';rptHtml+='<textarea id="orgRpt" class="input" style="min-height:320px;resize:vertical;font-size:.68rem;font-family:monospace;line-height:1.55;margin-bottom:10px" readonly>'+esc(txt)+'</textarea>';rptHtml+='<button class="btn-sm" style="width:100%;margin-top:8px" id="rptBtn" onclick="document.getElementById(&quot;rptBtn&quot;).textContent=&quot;Copied!&quot;;navigator.clipboard.writeText(document.getElementById(&quot;orgRpt&quot;).value)">Copy Full Report</button>';return rptHtml;
}
function orgHealth(active,feGroups){
  let html='<p class="muted mb12" style="font-size:.75rem">Sign-up progress per FE group.</p>';
  feGroups.filter(fg=>fg.active).forEach(fg=>{
    const count=active.filter(e=>(e.feGroups||[]).includes(fg.id)).length;
    const groups=fg.isPixie?0:Math.ceil(count/(fg.cap||5));
    const pct=count>0?Math.min(100,20*count):0;
    const color=count>0?"#66BB6A":"#546E7A";
    const countLabel=count+" "+(fg.isPixie?"participants":(count!==1?"cabins":"cabin"));
    const groupLabel=fg.isPixie?"":('<div style="font-size:.62rem;color:rgba(0,26,62,.78);margin-bottom:4px">'+groups+' group'+(groups!==1?"s":"")+" · Cap "+fg.cap+"</div>");
    html+='<div style="margin-bottom:12px">';
    html+='<div style="display:flex;justify-content:space-between;margin-bottom:4px">';
    html+='<span style="font-size:.78rem;color:#001A3E;font-family:Cinzel,serif">'+fg.icon+" "+fg.name+"</span>";
    html+='<span style="font-size:.74rem;color:#001A3E;font-weight:700">'+countLabel+"</span></div>";
    html+=groupLabel;
    html+='<div class="health-bar"><div class="health-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  });
  return html;
}
function orgExport(){return`<p class="muted mb12" style="font-size:.76rem">Download all sign-up data as a CSV file you can open in Google Sheets or Excel.</p><button class="btn-sm" style="width:100%;margin-bottom:10px" onclick="exportCSV(A.entries.filter(e=>e.status!=='Cancelled'))">📥 Download CSV</button><div class="info-box" style="font-size:.72rem">Includes cabin, deck groups, FE groups, guest names, characters, colors, celebration, notes, and organizer notes.</div>`;}

function orgDanger(){return`<div class="warn-box mb12">⚠️ <strong>Danger Zone</strong> — Actions here are permanent and cannot be undone.</div><label class="label">Type DELETE to confirm group deletion</label><span class="hint">This permanently deletes the group and ALL sign-up data. There is no recovery.</span><input class="input mb8" placeholder="Type DELETE here" value="${esc(A.deleteConfirm)}" oninput="A.deleteConfirm=this.value;vDashboard()"/><button class="btn-warn" onclick="deleteGroup()" ${A.deleteConfirm!=="DELETE"?"disabled style='opacity:.3'":""}>🗑 Permanently Delete This Group</button>`;}
async function deleteGroup(){if(A.deleteConfirm!=="DELETE")return;if(!confirm("FINAL WARNING: This cannot be undone. Delete group and all data?"))return;try{const p=new URLSearchParams();p.append("code","eq."+A.group.code);await fetch(SB+"/rest/v1/groups?"+p,{method:"DELETE",headers:H});alert("Group deleted.");A.view="landing";A.deleteConfirm="";render();}catch(e){alert("Error: "+e.message);}}
